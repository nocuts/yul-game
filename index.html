<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스즈메의 문단속 : 모두의 이야기 (YUL의 문단속)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Noto Sans KR', sans-serif;
            background: #090a12; color: #fff;
        }

        #game-frame {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            background: linear-gradient(160deg, #0a0e1a 0%, #1a1b35 35%, #2b1b36 70%, #4a2040 100%);
            overflow: hidden;
        }

        /* 첫 화면 타이틀 (scene_00) */
        #title-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            background: #090a12; padding-bottom: 40px;
            transition: opacity 0.5s ease;
        }

        .title-bg-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        .title-gradient-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(9,10,18,0.1) 0%, rgba(9,10,18,0.4) 60%, rgba(9,10,18,0.92) 100%);
            z-index: 2; pointer-events: none;
        }

        .title-controls {
            position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 14px;
        }

        .set-selector {
            background: rgba(15, 23, 42, 0.85); border: 1px solid #ffd166; color: #ffd166;
            font-family: inherit; font-size: 0.9em; font-weight: 700; padding: 6px 16px; border-radius: 15px; outline: none;
        }

        .start-btn {
            background: linear-gradient(135deg, #ffd166 0%, #f4a261 100%);
            color: #0d1b2a; font-family: inherit; font-size: 1.15em; font-weight: 800;
            padding: 14px 40px; border-radius: 30px; border: none; cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 209, 102, 0.6);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-btn:active { transform: scale(0.96); }

        #header-bar {
            position: absolute; top: 15px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }

        .title-badge {
            background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 20px;
            padding: 6px 16px; font-size: 0.85em; font-weight: 700; color: #ffd166;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); pointer-events: none;
        }

        /* 일러스트 표시 영역 */
        #illustration-area {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 55px 15px 15px 15px; pointer-events: none; z-index: 2;
        }

        .illustration-card {
            background: rgba(18, 22, 41, 0.55); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-top: 1px solid rgba(255, 209, 102, 0.4);
            border-radius: 16px; padding: 10px; max-width: 800px; width: 100%; height: 55vh; text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }

        .scene-image {
            max-width: 100%; max-height: 100%; width: auto; height: auto;
            object-fit: contain; border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: block; margin: auto;
            animation: fadeIn 0.35s ease-out;
        }

        .fallback-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; color: #e2e8f0; font-size: 0.95em; line-height: 1.6; word-break: keep-all;
        }

        .fallback-tag {
            background: rgba(255, 209, 102, 0.2); border: 1px solid #ffd166; color: #ffd166;
            padding: 3px 12px; border-radius: 15px; font-size: 0.8em; margin-bottom: 10px; font-weight: bold;
        }

        /* 하단 대화창 */
        #dialog-area {
            height: 215px; background: linear-gradient(180deg, rgba(13, 17, 32, 0.88) 0%, rgba(8, 10, 20, 0.96) 100%);
            backdrop-filter: blur(16px); border-top: 2px solid rgba(255, 209, 102, 0.6);
            padding: 18px 22px; position: relative; display: flex; flex-direction: column; justify-content: space-between;
            z-index: 5; cursor: pointer;
        }

        #speaker-badge {
            display: inline-block; align-self: flex-start; background: rgba(255, 209, 102, 0.15);
            border: 1px solid #ffd166; color: #ffd166; font-size: 0.9em; font-weight: 700;
            padding: 4px 14px; border-radius: 6px; margin-bottom: 8px;
        }

        #dialog-text { font-size: 1.06em; line-height: 1.6; color: #f8fafc; word-break: keep-all; }

        #nav-controls {
            display: flex; justify-content: flex-end; align-items: center; gap: 10px;
            margin-top: 6px;
        }

        .nav-btn {
            background: rgba(255, 209, 102, 0.1); border: 1px solid rgba(255, 209, 102, 0.4);
            color: #ffd166; font-family: inherit; font-size: 0.85em; font-weight: 700;
            padding: 6px 16px; border-radius: 20px; cursor: pointer; transition: all 0.2s ease;
        }

        .nav-btn:hover, .nav-btn:active {
            background: #ffd166; color: #0d1b2a; border-color: #ffd166;
        }

        .nav-btn:disabled {
            opacity: 0.3; cursor: not-allowed; border-color: rgba(255,255,255,0.2); color: #888;
            background: transparent;
        }

        /* 퀘스트 팝업 */
        #quest-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 10, 20, 0.88); backdrop-filter: blur(12px); z-index: 100;
            align-items: center; justify-content: center; padding: 20px; cursor: default;
        }

        .quest-card {
            background: linear-gradient(145deg, rgba(26, 27, 53, 0.95) 0%, rgba(15, 16, 32, 0.98) 100%);
            border: 2px solid #ffd166; border-radius: 20px; padding: 28px 24px; max-width: 600px; width: 100%; text-align: center;
        }

        .quest-problem { font-size: 1.1em; margin-bottom: 22px; line-height: 1.6; color: #f1f5f9; word-break: keep-all; background: rgba(255, 255, 255, 0.04); padding: 16px; border-radius: 12px; }
        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .choice-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 209, 102, 0.3); color: #f8fafc; padding: 15px 10px; font-size: 1em; font-weight: 600; border-radius: 10px; cursor: pointer; }
        .choice-btn:active { background: #ffd166; color: #0d1b2a; }
        #feedback-msg { margin-top: 16px; font-size: 0.95em; font-weight: 700; min-height: 24px; }
        
        .clock-container { margin: 10px auto 20px auto; width: 140px; height: 140px; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<div id="game-frame">
    <!-- 첫 화면 타이틀 (scene_00) -->
    <div id="title-screen">
        <img src="scene_00.png" class="title-bg-img" alt="Title Background" onerror="this.style.display='none'">
        <div class="title-gradient-overlay"></div>
        <div class="title-controls">
            <select id="set-select" class="set-selector"></select>
            <button class="start-btn" onclick="startGame()">모험 시작하기 🚪✨</button>
        </div>
    </div>

    <!-- 상단 헤더 바 -->
    <div id="header-bar">
        <div class="title-badge" id="ep-badge">🚪 PROLOGUE</div>
    </div>

    <!-- 중앙 일러스트 영역 -->
    <div id="illustration-area">
        <div class="illustration-card" id="card-box"></div>
    </div>

    <!-- 하단 대화창 -->
    <div id="dialog-area" onclick="handleNext(event)">
        <div>
            <div id="speaker-badge">YUL (독백)</div>
            <div id="dialog-text">대사를 불러오는 중...</div>
        </div>
        
        <div id="nav-controls">
            <button class="nav-btn" id="prev-btn" onclick="handlePrev(event)">◀ 이전</button>
            <button class="nav-btn" id="next-btn" onclick="handleNext(event)">다음 ▶</button>
        </div>
    </div>

    <!-- 퀘스트 팝업 모달 -->
    <div id="quest-overlay" onclick="event.stopPropagation()">
        <div class="quest-card">
            <div id="clock-box" class="clock-container" style="display:none;"></div>
            <div id="quest-problem" class="quest-problem">문제를 불러오는 중...</div>
            <div class="choice-grid">
                <button class="choice-btn" onclick="checkAnswer(0)" id="btn0"></button>
                <button class="choice-btn" onclick="checkAnswer(1)" id="btn1"></button>
                <button class="choice-btn" onclick="checkAnswer(2)" id="btn2"></button>
                <button class="choice-btn" onclick="checkAnswer(3)" id="btn3"></button>
            </div>
            <div id="feedback-msg"></div>
        </div>
    </div>
</div>

        { ep: "EPISODE 2", imgSrc: "scene_18.png", imgGuide: "황금빛 사슬로 문을 닫아 잠그는 연출", speaker: "소타 (의자)", text: "YUL의 완벽한 시간 계산 덕분이야! 시코쿠의 재난을 막아냈어!" },

        // EPISODE 3: 고베 (scene_19 ~ scene_22)
        { ep: "EPISODE 3", imgSrc: "scene_19.png", imgGuide: "비 내리는 밤, 홀로 돌아가는 산꼭대기 폐유원지 관람차", speaker: "스즈메", text: "비가 너무 거세... 저기 산꼭대기 관람차 꼭대기에 문이 있어!" },
        { ep: "EPISODE 3", imgSrc: "scene_20.png", imgGuide: "미미즈에 감겨 90도 기울어진 관람차 칸", speaker: "스즈메", text: "칸이 기울어 떨어질 것 같아! 균형을 맞춰야 해!" },
        { ep: "EPISODE 3", questSlot: 5 },
        { ep: "EPISODE 3", imgSrc: "scene_21.png", imgGuide: "빗속에서 문을 닫기 위해 필사적으로 버티는 스즈메", speaker: "스즈메", text: "소타 씨가 없는 세상이 더 두려워! 문을 닫고 열쇠로 잠글게요!" },
        { ep: "EPISODE 3", imgSrc: "scene_22.png", imgGuide: "비가 갠 후 고베 유원지 분수대 위에 완성된 황금 마법진", speaker: "소타 (의자)", text: "고베의 문단속 완료! 하늘이 맑게 개었어!" },

        // EPISODE 4: 도쿄 (scene_23 ~ scene_25)
        { ep: "EPISODE 4", imgSrc: "scene_23.png", imgGuide: "도쿄행 전철 안 창밖, 도쿄를 뒤덮은 거대한 재난", speaker: "YUL (독백)", text: "도쿄의 하늘... 지금까지와는 비교도 안 될 만큼 거대한 미미즈가 솟구치고 있었다." },
        { ep: "EPISODE 4", imgSrc: "scene_24.png", imgGuide: "도쿄 지하 깊은 공사 현장, 거대한 아치형 문 너머 미미즈", speaker: "스즈메", text: "여기가 도쿄의 모든 재난이 시작되는 거대한 문이야!" },
        { ep: "EPISODE 4", questSlot: 6 },
        { ep: "EPISODE 4", imgSrc: "scene_25.png", imgGuide: "지하 거대 문 봉인 후 거친 숨을 내쉬는 주인공들", speaker: "소타 (의자)", text: "지하 문은 잠갔지만... 미미즈 본체가 상공 10,000m 위로 솟구쳤어! 하늘로 가야 해!" },

        // EPISODE 5 & 6: 상공 및 저세상 (scene_26 ~ scene_30)
        { ep: "EPISODE 5", imgSrc: "scene_26.png", imgGuide: "도쿄 상공 10,000m, 얼어붙어 요석이 되어가는 소타", speaker: "스즈메", text: "소타 씨... 몸이 차갑게 굳어가고 있잖아... 요석이 된 거야...?" },
        { ep: "EPISODE 5", imgSrc: "scene_27.png", imgGuide: "요석이 되어가는 소타와 눈물 흘리는 스즈메", speaker: "소타", text: "스즈메... YUL... 사람들의 내일을 부탁한다." },
        { ep: "EPISODE 5", imgSrc: "scene_28.png", imgGuide: "얼어붙은 요석을 미미즈 심장에 꽂아 넣는 스즈메", speaker: "스즈메", text: "소타 씨를 구하러 저세상으로 갈 거야! 반드시 되찾아올게!" },
        { ep: "EPISODE 6", imgSrc: "scene_29.png", imgGuide: "해와 달이 동시에 뜬 저세상(토코요)의 언덕", speaker: "YUL (독백)", text: "모든 시간이 하나로 모여 있는 곳... 하늘에는 해와 달이 동시에 빛나고 있었다." },
        { ep: "EPISODE 6", questSlot: 7 },
        { ep: "EPISODE 6", imgSrc: "scene_30.png", imgGuide: "소타, 스즈메, YUL이 함께 열쇠로 문을 영구 봉인하는 신", speaker: "소타 & 스즈메 & YUL", text: "돌려드리옵나이다! 우리의 소중한 내일로!" },

        // EPILOGUE (scene_31 ~ scene_32)
        { ep: "EPILOGUE", imgSrc: "scene_31.png", imgGuide: "아침 방 안 책상에서 그림을 완성한 YUL", speaker: "YUL (독백)", text: "눈을 떴을 때, 나는 내 방 책상 앞에 앉아 있었다. 수학은 단순한 계산이 아니라 세상을 지키는 따뜻한 마법이었다." },
        { ep: "EPILOGUE", imgSrc: "scene_32.png", imgGuide: "창문 너머 푸른 들판에서 손을 흔드는 스즈메, 소타, 다이진", speaker: "YUL", text: "언젠가 다시 그 문이 열린다 해도, 나는 주저 없이 대답할 것이다. '다녀오겠습니다! ✨'" }
    ];

    let currentSetIndex = 0;
    let currentIndex = 0;
    let isQuestActive = false;

    const titleScreen = document.getElementById('title-screen');
    const setSelect = document.getElementById('set-select');
    const epBadge = document.getElementById('ep-badge');
    const cardBox = document.getElementById('card-box');
    const speakerBadge = document.getElementById('speaker-badge');
    const dialogText = document.getElementById('dialog-text');
    const questOverlay = document.getElementById('quest-overlay');
    const questProblem = document.getElementById('quest-problem');
    const feedbackMsg = document.getElementById('feedback-msg');
    const clockBox = document.getElementById('clock-box');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    // 세트 완료 여부 로컬 스토리지 키
    const STORAGE_KEY = "yul_math_cleared_sets";

    function getClearedSets() {
        try {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        } catch (e) {
            return [];
        }
    }

    function saveClearedSet(setId) {
        const cleared = getClearedSets();
        if (!cleared.includes(setId)) {
            cleared.push(setId);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(cleared));
        }
    }

    // 드롭다운 옵션 갱신 (완료된 세트에 ✅ 뱃지 표시)
    function updateSetSelector() {
        const cleared = getClearedSets();
        let html = '<option value="random">🎲 무작위 세트 도전</option>';
        setInfo.forEach(info => {
            const isDone = cleared.includes(info.id);
            const checkMark = isDone ? " ✅ (완료)" : "";
            html += `<option value="${info.id}">📖 ${info.title}${checkMark}</option>`;
        });
        setSelect.innerHTML = html;
    }

    function startGame() {
        const val = setSelect.value;
        if (val === "random") {
            currentSetIndex = Math.floor(Math.random() * problemSets.length);
        } else {
            currentSetIndex = parseInt(val, 10);
        }

        titleScreen.style.opacity = '0';
        setTimeout(() => {
            titleScreen.style.display = 'none';
            currentIndex = 0;
            renderScene();
        }, 500);
    }

    function resetToTitle() {
        currentIndex = 0;
        isQuestActive = false;
        questOverlay.style.display = "none";
        updateSetSelector(); // 완료 상태 재반영
        titleScreen.style.display = 'flex';
        setTimeout(() => {
            titleScreen.style.opacity = '1';
        }, 50);
    }

    function handleImageError(guideText) {
        cardBox.innerHTML = `
            <div class="fallback-box">
                <span class="fallback-tag">🖼️ 연출 가이드</span>
                <div>${guideText}</div>
            </div>
        `;
    }

    function renderClock(hours, minutes) {
        const hourAngle = (hours % 12 + minutes / 60) * 30;
        const minuteAngle = minutes * 6;
        return `
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <circle cx="50" cy="50" r="45" fill="#1a1b35" stroke="#ffd166" stroke-width="3"/>
                ${[...Array(12)].map((_, i) => {
                    const ang = (i + 1) * 30 * Math.PI / 180;
                    const x1 = 50 + 36 * Math.sin(ang); const y1 = 50 - 36 * Math.cos(ang);
                    return `<text x="${x1}" y="${y1}" fill="#ffd166" font-size="6" text-anchor="middle" dominant-baseline="central" font-weight="bold">${i + 1}</text>`;
                }).join('')}
                <line x1="50" y1="50" x2="${50 + 22 * Math.sin(hourAngle * Math.PI / 180)}" y2="${50 - 22 * Math.cos(hourAngle * Math.PI / 180)}" stroke="#ffd166" stroke-width="3.5" stroke-linecap="round"/>
                <line x1="50" y1="50" x2="${50 + 32 * Math.sin(minuteAngle * Math.PI / 180)}" y2="${50 - 32 * Math.cos(minuteAngle * Math.PI / 180)}" stroke="#2ec4b6" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="50" cy="50" r="3" fill="#ffd166"/>
            </svg>
        `;
    }

    function renderScene() {
        const item = scriptData[currentIndex];
        if (!item) return;

        prevBtn.disabled = (currentIndex === 0);

        // 엔딩 씬(마지막) 도달 시 세트 클리어 기록 저장 및 버튼 전환
        if (currentIndex === scriptData.length - 1) {
            saveClearedSet(currentSetIndex);
            nextBtn.innerText = "처음 🔄";
            nextBtn.onclick = function(e) {
                if (e) e.stopPropagation();
                resetToTitle();
            };
        } else {
            nextBtn.innerText = "다음 ▶";
            nextBtn.onclick = handleNext;
        }

        if (item.ep) epBadge.innerText = `🚪 ${item.ep}`;

        if (item.questSlot !== undefined) {
            isQuestActive = true;
            const q = problemSets[currentSetIndex][item.questSlot];

            if (q.clock) {
                clockBox.innerHTML = renderClock(q.clock.hours, q.clock.minutes);
                clockBox.style.display = "block";
            } else {
                clockBox.style.display = "none";
            }

            questProblem.innerText = q.problem;
            feedbackMsg.innerText = "";

            for (let i = 0; i < 4; i++) {
                document.getElementById(`btn${i}`).innerText = q.choices[i];
            }
            questOverlay.style.display = "flex";
        } else {
            isQuestActive = false;
            questOverlay.style.display = "none";

            if (item.imgSrc) {
                cardBox.innerHTML = `
                    <img src="${item.imgSrc}" 
                         alt="Scene Image" 
                         class="scene-image" 
                         onerror="handleImageError('${item.imgGuide ? item.imgGuide.replace(/'/g, "\\'") : '이미지를 불러올 수 없습니다.'}')">
                `;
            } else {
                handleImageError(item.imgGuide || '');
            }

            if (item.speaker) speakerBadge.innerText = item.speaker;
            if (item.text) dialogText.innerText = item.text;
        }
    }

    function handleNext(event) {
        if (event) event.stopPropagation();
        if (isQuestActive) return;

        if (currentIndex === scriptData.length - 1) {
            resetToTitle();
            return;
        }

        if (currentIndex < scriptData.length - 1) {
            currentIndex++;
            renderScene();
        }
    }

    function handlePrev(event) {
        if (event) event.stopPropagation();
        if (isQuestActive) return;
        if (currentIndex > 0) {
            currentIndex--;
            renderScene();
        }
    }

    function checkAnswer(selectedIndex) {
        const slot = scriptData[currentIndex].questSlot;
        const currentQuest = problemSets[currentSetIndex][slot];
        if (selectedIndex === currentQuest.answer) {
            feedbackMsg.style.color = "#ffd166";
            feedbackMsg.innerText = currentQuest.correctMsg;

            setTimeout(() => {
                questOverlay.style.display = "none";
                isQuestActive = false;
                currentIndex++;
                renderScene();
            }, 900);
        } else {
            feedbackMsg.style.color = "#ffb703";
            feedbackMsg.innerText = currentQuest.wrongMsg;
        }
    }

    // 초기 실행 시 드롭다운 렌더링
    updateSetSelector();
</script>
</body>
</html>
